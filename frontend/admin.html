<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./image/PrimeCuts.png">
    <link rel="apple-touch-icon" href="./image/PrimeCuts.png">
    <title>PrimeCuts | Barber Portaal</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        bebas: ['"Bebas Neue"', "sans-serif"],
                        mono: ['"JetBrains Mono"', "monospace"]
                    },
                    colors: {
                        appbg: "#050505",
                        panelbg: "#0A0A0A",
                        cardbg: "#111111",
                        accent: {
                            DEFAULT: "#e5342a",
                            dark: "#a5241d",
                            light: "#ff4c40"
                        }
                    }
                }
            }
        };
    </script>

    <style>
        body {
            font-family: "Inter", sans-serif;
            background: #050505;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="toast" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-[60] max-w-md w-[92%] px-5 py-4 rounded-xl text-sm font-semibold shadow-2xl"></div>

    <!-- Header -->
    <header class="border-b border-neutral-900 bg-panelbg">
        <div class="max-w-5xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="./image/PrimeCuts.png" alt="PrimeCuts Logo" class="h-12 w-auto">
            </div>
            <div class="flex items-center gap-4">
                <span id="lastUpdated" class="hidden md:inline text-neutral-500 text-xs font-mono"></span>
                <button id="refreshBtn" type="button"
                    class="w-10 h-10 flex items-center justify-center rounded-xl border border-neutral-800 hover:border-accent/50 transition text-neutral-400 hover:text-accent"
                    title="Ververs">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button id="logoutBtn" type="button"
                    class="px-5 py-2.5 rounded-xl border border-neutral-800 hover:border-accent/50 transition text-sm font-semibold">
                    Uitloggen
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-10">
        <h1 class="font-bebas uppercase text-4xl tracking-wide mb-2">Afspraken</h1>
        <p class="text-neutral-500 text-sm mb-8">
            Ververst automatisch elke 15 minuten.
        </p>

        <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
            <div class="flex gap-2">
                <button type="button" data-tab="active"
                    class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold uppercase tracking-wide transition">
                    Actief
                </button>
                <button type="button" data-tab="past"
                    class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold uppercase tracking-wide transition">
                    Voltooid
                </button>
            </div>

            <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500 text-sm"></i>
                <input id="searchInput" type="text" placeholder="Zoek op naam..."
                    class="w-full bg-cardbg border border-neutral-800 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:border-accent transition">
            </div>
        </div>

        <div id="loadingState" class="text-neutral-500 text-sm">Afspraken laden...</div>
        <div id="emptyState" class="hidden text-neutral-500 text-sm">Geen afspraken gevonden.</div>
        <div id="appointmentList" class="space-y-4"></div>
    </main>

    <!-- Cancel confirmation modal -->
    <div id="cancelModal" class="fixed inset-0 hidden z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="bg-panelbg border border-neutral-800 rounded-2xl shadow-2xl w-full max-w-md p-8">
            <h2 class="font-bebas uppercase text-2xl mb-3 tracking-wide">Afspraak Annuleren?</h2>
            <p id="cancelModalText" class="text-neutral-400 mb-8 text-sm"></p>
            <div class="flex gap-3">
                <button id="cancelModalClose" type="button"
                    class="flex-1 py-3 rounded-xl border border-neutral-700 hover:border-neutral-500 transition font-semibold text-sm">
                    Terug
                </button>
                <button id="cancelModalConfirm" type="button"
                    class="flex-1 py-3 rounded-xl bg-gradient-to-b from-accent-light via-accent to-accent-dark font-bold text-sm uppercase tracking-wide transition-all hover:-translate-y-0.5">
                    Ja, Annuleren
                </button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
